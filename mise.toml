[tools]
deno = "2.9"
"github:microsoft/apm" = "latest"
go = "1.27"
"go:golang.org/x/tools/gopls" = "latest"
lefthook = "2"
"npm:@fission-ai/openspec" = "1.12"
"npm:@getpaseo/cli" = "0.8.0-beta.1"

[tasks]
prepare = "lefthook install"

[tasks.test-paseo-scenarios]
description = "Запустить последовательный каталог production-сценариев Paseo"
run = "go test -p=1 -parallel=1 -count=1 -timeout=20m -tags=paseo_integration -run '^TestProduction' ./cmd/openspec-apply-orchestrator"
